<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diatonic Compass - Music Learning Tools</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('diatonicCompassPreferences');
          if (!stored) return;
          var prefs = JSON.parse(stored);
          if (prefs && prefs.darkMode === true) {
            document.documentElement.classList.add('dark-mode-preload');
          }
        } catch (e) {
          // Ignore storage or parsing errors for early theme setup.
        }
      })();
    </script>
    <style>
      html.dark-mode-preload,
      html.dark-mode-preload body,
      body.dark-mode {
        background-color: #121212;
        color-scheme: dark;
      }
    </style>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #app {
        height: 100%;
        width: 100%;
      }
    </style>
    <script type="module" crossorigin src="/music-learning-tools/assets/diatonic-compass-CoixpsAu.js"></script>
    <link rel="modulepreload" crossorigin href="/music-learning-tools/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/music-learning-tools/assets/preload-helper-DHcIAiwC.js">
    <link rel="modulepreload" crossorigin href="/music-learning-tools/assets/index-DMHO6iGb.js">
    <link rel="stylesheet" crossorigin href="/music-learning-tools/assets/diatonic-compass-BBN6ZFSa.css">
  </head>
  <body>
    <script>
      if (document.documentElement.classList.contains('dark-mode-preload')) {
        document.body.classList.add('dark-mode');
        document.documentElement.classList.remove('dark-mode-preload');
      }
    </script>
    <div id="app"></div>
  </body>
</html>
