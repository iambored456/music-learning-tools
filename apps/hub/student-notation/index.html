<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Notation - Music Learning Tools</title>
    <link rel="icon" href="data:," />
    <script>
      window.TONE_SILENCE_LOGGING = true;
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #app {
        height: 100%;
        width: 100%;
        display: flex;
      }

      /* Inline loading screen — rendered immediately before JS loads */
      #app-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #app-loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 2rem;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .logo-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(168, 140, 243, 0.4));
      }
      .logo-circle {
        fill: none;
        stroke: #a88cf3;
        stroke-width: 2;
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        animation: drawCircle 2s ease-in-out forwards, pulse 2s ease-in-out 2s infinite;
        transform-origin: center;
      }
      .logo-path {
        fill: none;
        stroke: #4a90e2;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawPath 1.5s ease-in-out 0.5s forwards;
      }
      @keyframes drawCircle { to { stroke-dashoffset: 0; } }
      @keyframes drawPath { to { stroke-dashoffset: 0; } }
      @keyframes pulse {
        0%, 100% { opacity: 1; stroke-width: 2; }
        50% { opacity: 0.6; stroke-width: 2.5; }
      }
      .loading-title {
        font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 2rem;
        font-weight: 400;
        color: #ffffff;
        margin: 0 0 2.5rem 0;
        letter-spacing: 0.5px;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.3s forwards;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .loading-progress-container {
        width: 100%;
        margin-bottom: 1.5rem;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.6s forwards;
      }
      .loading-progress-bar {
        width: 100%;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 0.75rem;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
      }
      .loading-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4a90e2 0%, #a88cf3 100%);
        border-radius: 2px;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        position: relative;
        overflow: hidden;
      }
      .loading-progress-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        animation: shimmer 2s infinite;
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      #app-loading-screen.is-prejs-loading .loading-progress-bar {
        height: 6px;
        border-radius: 999px;
      }
      #app-loading-screen.is-prejs-loading .loading-progress-fill {
        width: 38%;
        min-width: 72px;
        transition: none;
        animation: preJsProgressTravel 1.65s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        transform-origin: left center;
      }
      #app-loading-screen.is-prejs-loading .loading-progress-fill::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        animation: preJsProgressGlow 1.65s ease-in-out infinite;
      }
      @keyframes preJsProgressTravel {
        0% { transform: translateX(-125%) scaleX(0.65); opacity: 0.45; }
        45% { opacity: 1; }
        100% { transform: translateX(285%) scaleX(1.1); opacity: 0.45; }
      }
      @keyframes preJsProgressGlow {
        0% { transform: translateX(-100%); opacity: 0.45; }
        50% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0.45; }
      }
      .loading-progress-text {
        font-family: 'Atkinson Hyperlegible Next', monospace;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 1px;
      }
      .loading-status {
        font-family: 'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.9s forwards;
        min-height: 1.5rem;
        transition: color 0.3s ease;
      }
      @media (max-width: 768px) {
        .loading-container { max-width: 300px; }
        .loading-logo { width: 90px; height: 90px; }
        .loading-title { font-size: 1.5rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading-screen, .loading-logo, .logo-circle, .logo-path,
        .loading-title, .loading-progress-container, .loading-status,
        .loading-progress-fill, .loading-progress-fill::after { animation: none !important; transition: none !important; }
        .loading-title, .loading-progress-container, .loading-status { opacity: 1; }
        .logo-circle { stroke-dashoffset: 0; }
        .logo-path { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app-loading-screen" class="is-prejs-loading">
      <div class="loading-container">
        <div class="loading-logo">
          <svg viewBox="0 0 100 100" class="logo-svg">
            <circle cx="50" cy="50" r="45" class="logo-circle" />
            <path d="M 30 50 Q 50 30, 70 50 T 70 70" class="logo-path" />
          </svg>
        </div>
        <h1 class="loading-title">Student Notation</h1>
        <div class="loading-progress-container">
          <div class="loading-progress-bar">
            <div class="loading-progress-fill" id="loading-progress-fill"></div>
          </div>
          <div class="loading-progress-text" id="loading-progress-text">Preparing</div>
        </div>
        <div class="loading-status" id="loading-status">Loading scripts...</div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var fill = document.getElementById('loading-progress-fill');
        var txt  = document.getElementById('loading-progress-text');
        if (!fill) return;
        var started = Date.now();
        var handle;
        function tick() {
          var elapsed = Date.now() - started;
          if (txt) {
            var dotCount = Math.floor(elapsed / 450) % 4;
            txt.textContent = 'Preparing' + '.'.repeat(dotCount);
          }
          handle = requestAnimationFrame(tick);
        }
        handle = requestAnimationFrame(tick);
        window.__clearStage1Progress = function () {
          cancelAnimationFrame(handle);
        };
      })();
    </script>
    <script type="module" src="/student-notation/main.ts"></script>
  </body>
</html>
